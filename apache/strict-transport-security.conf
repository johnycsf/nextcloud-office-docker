# Nextcloud setup check wants Strict-Transport-Security with max-age >= 15552000.
# Browsers ignore HSTS on plain HTTP; the header is still emitted so the
# overview is clean, and it becomes effective if TLS is added later.
<IfModule mod_headers.c>
	Header always set Strict-Transport-Security "max-age=15552000; includeSubDomains"
</IfModule>
