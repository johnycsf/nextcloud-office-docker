services:
  # Official MariaDB image + Nextcloud DB settings:
  # https://github.com/nextcloud/docker#running-this-image-with-docker-compose
  # https://docs.nextcloud.com/server/latest/admin_manual/configuration_database/linux_database_configuration.html
  db:
    image: mariadb:lts
    container_name: nextcloud-db
    restart: unless-stopped
    command:
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --innodb-file-per-table=1
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MYSQL_USER=${MYSQL_USER:-nextcloud}
    volumes:
      - ./data/db:/var/lib/mysql
    networks:
      - nextcloud-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=${TZ:-America/New_York}
      # Auto-configure MariaDB (skips SQLite / DB wizard fields):
      # https://github.com/nextcloud/docker#using-an-external-database
      - MYSQL_HOST=db
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MYSQL_USER=${MYSQL_USER:-nextcloud}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./data/html:/var/www/html
    ports:
      - "${NEXTCLOUD_PORT:-80}:80"
    networks:
      - nextcloud-net

  collabora:
    image: collabora/code:latest
    container_name: collabora
    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_add:
      - MKNOD
    environment:
      - aliasgroup1=${ALIASGROUP1:-http://127.0.0.1:80}
      - domain=${COLLABORA_DOMAIN_REGEX:-.*}
      - server_name=${COLLABORA_SERVER_NAME:-127.0.0.1:9980}
      - dictionaries=${DICTIONARIES:-en_US}
      - username=admin
      - password=${COLLABORA_ADMIN_PASSWORD:-changeme}
      - extra_params=--o:ssl.enable=false --o:ssl.termination=false --o:ssl.ssl_verification=false --o:welcome.enable=false --o:net.frame_ancestors=*
    ports:
      - "${COLLABORA_PORT:-9980}:9980"
    networks:
      - nextcloud-net

networks:
  nextcloud-net:
